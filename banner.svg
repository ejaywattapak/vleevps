<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">VLEEE AI VPS Agent</title>
  <desc id="desc">Autonomous AI-powered VPS troubleshooting and repair</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0b1730"/>
      <stop offset="1" stop-color="#071d24"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <circle cx="1050" cy="75" r="180" fill="#22d3ee" opacity="0.07"/>
  <circle cx="110" cy="370" r="220" fill="#60a5fa" opacity="0.06"/>
  <path d="M70 330H1130" stroke="#1e3a52" stroke-width="2"/>
  <path d="M70 330H430" stroke="url(#accent)" stroke-width="4" filter="url(#glow)"/>

  <g transform="translate(86 78)">
    <rect x="0" y="0" width="118" height="118" rx="28" fill="#0d2435" stroke="#22d3ee" stroke-width="3"/>
    <rect x="25" y="34" width="68" height="58" rx="16" fill="none" stroke="#e5faff" stroke-width="5"/>
    <circle cx="45" cy="61" r="6" fill="#22d3ee"/>
    <circle cx="73" cy="61" r="6" fill="#60a5fa"/>
    <path d="M42 78 Q59 89 76 78" fill="none" stroke="#e5faff" stroke-width="4" stroke-linecap="round"/>
    <path d="M59 34V20" stroke="#e5faff" stroke-width="4" stroke-linecap="round"/>
    <circle cx="59" cy="15" r="6" fill="#22d3ee"/>
    <path d="M17 55H5M113 55h-12M22 101l-9 9M96 101l9 9" stroke="#60a5fa" stroke-width="4" stroke-linecap="round"/>
  </g>

  <text x="245" y="125" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="54" font-weight="700">VLEEE AI VPS Agent</text>
  <text x="248" y="178" fill="#8ee8f6" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="600">AUTONOMOUS VPS TROUBLESHOOTING &amp; REPAIR</text>
  <text x="248" y="225" fill="#b7c8d8" font-family="Arial,Helvetica,sans-serif" font-size="20">Inspect • Diagnose • Repair • Verify</text>

  <g transform="translate(245 270)">
    <rect width="360" height="46" rx="23" fill="#0e2638" stroke="#214761"/>
    <circle cx="25" cy="23" r="7" fill="#34d399"/>
    <text x="45" y="30" fill="#d8f5ff" font-family="Arial,Helvetica,sans-serif" font-size="18">REAL ROOT-LEVEL VPS ACCESS</text>
  </g>
</svg>
